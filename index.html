<!doctype html>
<html lang="ar" dir="rtl" manifest="cache.appcache">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width,initial-scale=1,viewport-fit=cover">
<meta name="theme-color" content="#020817">
<title>مركز المهندس | PS4 HEN</title>
<style>
html,body{margin:0;width:100%;height:100%;background:#020817;color:#fff;font-family:system-ui,-apple-system,"Segoe UI",sans-serif}
body{display:flex;align-items:center;justify-content:center}
#fallback{text-align:center;padding:24px;display:none}
#fallback img{width:90px;height:90px;border-radius:50%;object-fit:cover}
#fallback p{margin:14px 0;color:#b9c7d9}
</style>
</head>
<body>
<div id="fallback"><img src="logo.png" alt="مركز المهندس"><p>جاري فتح صفحة التشغيل...</p></div>
<script>
(function(){
"use strict";
var m=/PlayStation\s+4[\/ ](\d+)\.(\d+)/.exec(navigator.userAgent);
var supported={1302:true,1304:true,1350:true,1352:true};
var n=null;
if(m){var minor=parseInt(m[2],10);if(!isNaN(minor))n=parseInt(m[1],10)*100+minor;}
if(n===null||supported[n])location.replace("jb.html?auto=1");
else{document.getElementById("fallback").style.display="block";document.querySelector("#fallback p").textContent="إصدار PS4 غير مدعوم في هذه الصفحة.";}
})();
</script>
</body>
</html>
