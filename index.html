<!doctype html>
<html lang="ar" dir="rtl" manifest="cache.appcache">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width,initial-scale=1">
<meta name="theme-color" content="#020817">
<title>مركز المهندس</title>
<style>
html,body{margin:0;padding:0;min-height:100%;background:radial-gradient(circle at center,rgba(0,20,55,.34),rgba(0,0,0,.86) 72%),url("logo.png") center center/min(62vw,560px) auto no-repeat,#020817;background-attachment:fixed;color:#e8f1ff;font:15px/1.45 "Segoe UI",system-ui,sans-serif}
#brand{text-align:center;padding:8px 10px;background:rgba(2,8,23,.62);border-bottom:1px solid rgba(40,136,255,.35);box-shadow:0 8px 30px rgba(0,0,0,.35);backdrop-filter:blur(6px)}
#brand img{width:28px;height:28px;margin-right:8px;border-radius:50%;vertical-align:middle}
#brand b{font-size:15px;font-weight:700;letter-spacing:.14em;color:#e6ebf2;vertical-align:middle}
#spin{position:fixed;top:calc(50% + 20px);left:50%;width:46px;height:46px;margin:-23px 0 0 -23px;border:4px solid #1e2732;border-top-color:#7fd0a0;border-radius:50%;animation:spin .9s linear infinite}
@keyframes spin{to{transform:rotate(360deg)}}
#msg{position:fixed;top:50%;left:0;right:0;transform:translateY(-50%);text-align:center;font-size:16px;letter-spacing:.5px;display:none}
#wrap{padding:0}#state,#out{display:none}
body.done #spin,body.fail #spin{display:none}
body.fail #msg{display:none}
body.fail #wrap{display:block;padding:14px 18px}
body.fail #state{display:block;font-size:22px;font-weight:700;margin:0 0 8px}
body.fail #out{display:block;white-space:pre-wrap;font:12px/1.45 Consolas,monospace;background:rgba(2,8,23,.76);border:1px solid rgba(40,136,255,.38);border-radius:5px;padding:10px 12px;height:calc(100vh - 141px);overflow-y:auto}
body.log #spin,body.log #msg{display:none}
body.log #wrap{padding:14px 18px}
body.log #state{display:block;font-size:22px;font-weight:700;margin:0 0 8px}
body.log #out{display:block;white-space:pre-wrap;font:12px/1.45 Consolas,monospace;background:rgba(2,8,23,.76);border:1px solid rgba(40,136,255,.38);border-radius:5px;padding:10px 12px;height:calc(100vh - 141px);overflow-y:auto}
.ok{color:#7fd0a0}.bad{color:#d08a7f}.warn{color:#d8c07f}.safe{color:#7fd0a0}.danger{color:#d08a7f}code{color:#9fb3d0}
</style>
</head>
<body>
<div id="brand"><img src="logo.png" alt="" width="28" height="28"><b>مركز المهندس</b></div>
<div id="spin"></div>
<div id="msg">Restart your console</div>
<div id="wrap"><div id="state"></div><div id="out"></div></div>
<script>
if ("serviceWorker" in navigator) {
  window.addEventListener("load", function () {
    navigator.serviceWorker.register("./service-worker.js?v=2", {scope:"./", updateViaCache:"none"})
      .catch(function(){});
  });
}
</script>
<script type="module">import "./jb.js?v=12";</script>
</body>
</html>
